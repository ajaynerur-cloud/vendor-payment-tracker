<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Vendor Payment Tracker</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/style.css"><script src="config.js"></script></head><body>
<header><div><h1>Vendor Payment Tracker</h1><p>Secure, synchronised and installable</p></div><div class="header-actions"><span id="syncState">Online</span><button id="installBtn" hidden>Install app</button><button id="signOutBtn" hidden>Sign out</button></div></header>
<main><section id="authCard" class="card auth"><h2>Sign in</h2><p class="muted">Use the same account on every device to access your payments.</p><form id="authForm"><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" minlength="6" placeholder="Password" required><div class="buttons"><button type="submit">Sign in</button><button type="button" class="secondary" id="signUpBtn">Create account</button></div></form><p id="authMsg" class="msg"></p></section>
<div id="app" hidden>
<section class="stats"><div class="card"><span>Grand total</span><strong id="grandTotal">₹0.00</strong></div><div class="card"><span>Payments shown</span><strong id="paymentCount">0</strong></div><div class="card"><span>Vendors shown</span><strong id="vendorCount">0</strong></div></section>
<section class="card form-card"><h2 id="formTitle">Add payment</h2><form id="paymentForm"><input type="hidden" name="id"><div class="grid"><label>Vendor name<input name="vendor" maxlength="120" required></label><label>Payment date<input name="payment_date" type="date" required></label><label>Payment mode<select name="mode"><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Cash</option><option>Card</option><option>Other</option></select></label><label>Purpose<input name="purpose" maxlength="240" required></label><label>Amount (₹)<input name="amount" inputmode="decimal" required></label></div><div class="buttons"><button type="submit">Save payment</button><button type="button" class="secondary" id="cancelEdit" hidden>Cancel edit</button></div></form></section>
<section class="card toolbar"><input id="search" placeholder="Search vendor, purpose or mode"><select id="modeFilter"><option value="">All payment modes</option><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Cash</option><option>Card</option><option>Other</option></select><input id="fromDate" type="date" title="From date"><input id="toDate" type="date" title="To date"><button id="exportBtn" class="secondary">Export CSV</button></section>
<div id="vendors"></div></div></main><div id="toast"></div><script type="module" src="assets/app.js"></script></body></html>
