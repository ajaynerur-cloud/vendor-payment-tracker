name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Step 1: You MUST check out the repository first
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Java/Gradle environment (if applicable)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Run your build or dependency analysis action
    - name: Run Build or Dependency Scan
      uses: gradle/actions/dependency-submission@v4 # Or whichever action threw the error
